name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu-core
      - run: pip install -e '.[dev]'
      - run: pytest -m "not browser" -v
      - name: check the example manifests
        run: for m in examples/*/media.json; do darkroom check "$m"; done
