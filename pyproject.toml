[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkroom"
version = "0.8.0"
description = "A small media-capture kit: stills, GIFs, MP4s, contact sheets, before/after pairs and doc galleries from a JSON shot list."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel McCoy Stephenson" }]
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=7", "imageio-ffmpeg>=0.5"]

[project.scripts]
darkroom = "darkroom.cli:main"

[project.urls]
Homepage = "https://github.com/Preponderous-Software/darkroom"

[tool.setuptools]
packages = ["darkroom", "darkroom.backends"]

[tool.setuptools.package-data]
darkroom = ["web/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Node Playwright and Chromium"]
